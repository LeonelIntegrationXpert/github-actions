# Descrição :
#   - Pipeline de CI/CD para MuleSoft com deploy no CloudHub 2.0 e publicação no Exchange.
#################################################################################################

name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches: [ dev, qa, prod ]

# Evita rodadas concorrentes na mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      # ========= Config comum =========
      SETTINGS_FILE: .maven/settings.xml
      SERVER_ID: Repository
      ENV_NAME: ${{ github.ref_name }}                   # dev | qa | prod (igual ao nome da branch)
      TARGET: CloudHub-US-East-2                         # respeita o case do CH2.0
      BUSINESS_GROUP_ID: 9d86053c-c394-4e52-b33c-029e02b59822
      # Overrides úteis (mantém padrão 4.9.0 / Java 17 e EDGE)
      MULE_VERSION: "4.9.0"
      JAVA_VERSION: "17"
      RELEASE_CHANNEL: "EDGE"

      # Credenciais (sempre por secrets)
      ANYPOINT_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}

    steps:
      #########################################################################
      # 1) Checkout
      #########################################################################
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #########################################################################
      # 2) JDK 17 + cache Maven nativo
      #########################################################################
      - name: ☕ Configurando JDK 17 (com cache Maven)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "maven"

      #########################################################################
      # 3) (Opcional) Go-offline para aquecer o cache e evitar "present but unavailable"
      #########################################################################
      - name: ⚡ Pré-download de dependências (go-offline)
        run: mvn -B -U -q -s "$SETTINGS_FILE" -P "$ENV_NAME" \
               -Dclient.id="$ANYPOINT_CLIENT_ID" -Dclient.secret="$ANYPOINT_CLIENT_SECRET" \
               dependency:go-offline || true

      #########################################################################
      # 4) Bump de versão só na branch atual (com [skip ci] p/ evitar loop)
      #########################################################################
      - name: 🔖 Incrementar versão do pom.xml (apenas branch atual)
        if: ${{ github.actor != 'github-actions[bot]' }}  # evita loop de commit do bot
        env:
          SETTINGS_FILE: .maven/settings.xml
          ENV_NAME: ${{ github.ref_name }}                 # dev | qa | prod
          ANYPOINT_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌿 Branch atual: $ENV_NAME"
          echo "🔍 Lendo versão atual do POM via Maven (com settings e credenciais)"

          # tenta pelo Maven (precisa resolver parent/BOM do Exchange)
          set +e
          CURR_VER=$(mvn -B -U -q \
            -s "$SETTINGS_FILE" -P "$ENV_NAME" \
            -Dclient.id="$ANYPOINT_CLIENT_ID" \
            -Dclient.secret="$ANYPOINT_CLIENT_SECRET" \
            -DforceStdout help:evaluate -Dexpression=project.version 2>/dev/null | tail -n1)
          RC=$?
          set -e

          if [ $RC -ne 0 ] || [ -z "$CURR_VER" ]; then
            echo "⚠️  Maven help:evaluate falhou. Usando fallback por grep no pom.xml…"
            CURR_VER=$(grep -m1 -E '^\s*<version>[^<]+' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          fi

          if [ -z "$CURR_VER" ]; then
            echo "❌ Não consegui determinar a versão atual."
            exit 1
          fi

          echo "📌 Versão atual: $CURR_VER"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURR_VER"
          NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "🚀 Nova versão: $NEW_VER"

          # aplica nova versão usando o plugin versions (com settings e credenciais também)
          mvn -B -U -q \
            -s "$SETTINGS_FILE" -P "$ENV_NAME" \
            -Dclient.id="$ANYPOINT_CLIENT_ID" \
            -Dclient.secret="$ANYPOINT_CLIENT_SECRET" \
            versions:set -DnewVersion="$NEW_VER"
          mvn -q versions:commit

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "🔖 Bump version to $NEW_VER [skip ci]" || echo "ℹ️ Nada para commitar"
          git push origin "$ENV_NAME" || echo "ℹ️ Push ignorado (sem mudanças)"
          echo "✅ Versão $NEW_VER publicada na branch $ENV_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      #########################################################################
      # 5) Build + Publish Exchange + Deploy CloudHub (um único comando)
      #########################################################################
      - name: 🚀 Publish to Exchange & ☁️ Deploy CH2.0
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌎 Ambiente: $ENV_NAME | 🎯 Target: $TARGET"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          mvn -B -U -s "$SETTINGS_FILE" -P "$ENV_NAME" \
             clean deploy mule:deploy \
             -DskipTests -DskipITs -DskipMunitTests \
             -Dclient.id="$ANYPOINT_CLIENT_ID" \
             -Dclient.secret="$ANYPOINT_CLIENT_SECRET" \
             -DserverId="$SERVER_ID" -Dserver="$SERVER_ID" \
             -Denv="$ENV_NAME" -Denvironment="$ENV_NAME" \
             -Dtarget="$TARGET" -Dregion="$TARGET" \
             -DbusinessGroupId="$BUSINESS_GROUP_ID" \
             -Dapp.runtime="$MULE_VERSION" -DmuleVersion="$MULE_VERSION" \
             -Djava.version="$JAVA_VERSION" \
             -DreleaseChannel="$RELEASE_CHANNEL"

          echo "✅ Exchange publicado e CH2.0 deployado com sucesso!"
