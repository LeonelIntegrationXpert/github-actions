#################################################################################################
# Descrição :
#   - Pipeline de CI/CD para MuleSoft com deploy no CloudHub 2.0 e publicação no Exchange.
#################################################################################################

name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches: 
      - dev
      - qa
      - prod

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      #########################################################################
      # Passo 1: Checkout do repositório
      #########################################################################
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para obter todo o histórico da branch

      #########################################################################
      # Passo 2: Configurar JDK 17
      #########################################################################
      - name: ☕ Configurando JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      #########################################################################
      # Passo 3: Incrementar a versão do projeto na branch atual
      #########################################################################
      - name: 🔖 Incrementar versão do pom.xml (apenas branch atual)
        if: ${{ github.actor != 'github-actions[bot]' }}  # evita loop de commit do bot
        env:
          SETTINGS_FILE: .maven/settings.xml
          ENV_NAME: ${{ github.ref_name }}                 # dev | qa | prod
          ANYPOINT_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌿 Branch atual: $ENV_NAME"
          echo "🔍 Lendo versão atual do POM via Maven (com settings e credenciais)"

          # tenta pelo Maven (precisa resolver parent/BOM do Exchange)
          set +e
          CURR_VER=$(mvn -B -U -q \
            -s "$SETTINGS_FILE" -P "$ENV_NAME" \
            -Dclient.id="$ANYPOINT_CLIENT_ID" \
            -Dclient.secret="$ANYPOINT_CLIENT_SECRET" \
            -DforceStdout help:evaluate -Dexpression=project.version 2>/dev/null | tail -n1)
          RC=$?
          set -e

          if [ $RC -ne 0 ] || [ -z "$CURR_VER" ]; then
            echo "⚠️  Maven help:evaluate falhou. Usando fallback por grep no pom.xml…"
            CURR_VER=$(grep -m1 -E '^\s*<version>[^<]+' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          fi

          if [ -z "$CURR_VER" ]; then
            echo "❌ Não consegui determinar a versão atual."
            exit 1
          fi

          echo "📌 Versão atual: $CURR_VER"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURR_VER"
          NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "🚀 Nova versão: $NEW_VER"

          # aplica nova versão usando o plugin versions (com settings e credenciais também)
          mvn -B -U -q \
            -s "$SETTINGS_FILE" -P "$ENV_NAME" \
            -Dclient.id="$ANYPOINT_CLIENT_ID" \
            -Dclient.secret="$ANYPOINT_CLIENT_SECRET" \
            versions:set -DnewVersion="$NEW_VER"
          mvn -q versions:commit

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "🔖 Bump version to $NEW_VER [skip ci]" || echo "ℹ️ Nada para commitar"
          git push origin "$ENV_NAME" || echo "ℹ️ Push ignorado (sem mudanças)"
          echo "✅ Versão $NEW_VER publicada na branch $ENV_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      #########################################################################
      # Passo 4: Cache das dependências Maven
      #########################################################################
      - name: 📦 Cache de dependências Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      #########################################################################
      # Passo 5: Publicação no Anypoint Exchange
      #########################################################################
      - name: 🚀 Publicar no Anypoint Exchange
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌎 Publicando no Anypoint Exchange - Ambiente: $GITHUB_REF_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          mvn deploy --settings .maven/settings.xml -P $GITHUB_REF_NAME -DskipMunitTests \
            -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}"

          echo "✅ Publicação no Exchange concluída!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      #########################################################################
      # Passo 6: Deploy no CloudHub 2.0
      #########################################################################
      - name: ☁️ Deploy no CloudHub 2.0
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️ Iniciando deploy no CloudHub 2.0 - Ambiente: $GITHUB_REF_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          mvn deploy --settings .maven/settings.xml -P $GITHUB_REF_NAME -DskipMunitTests -DmuleDeploy \
            -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
            -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}"

          echo "✅ Deploy no CloudHub 2.0 concluído com sucesso!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
